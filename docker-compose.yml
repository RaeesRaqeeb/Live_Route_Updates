# docker-compose.yml
version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: pakistan_route_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: yourpassword
      POSTGRES_DB: pakistan_route_db        # ← THIS auto-creates the DB on first run
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql   # ← optional init script
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pakistan_route_ai"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s    # ← give postgres time to fully boot

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pakistan_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@routeai.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy    # ← wait until postgres is truly ready
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  redis:
    image: redis:7-alpine
    container_name: pakistan_redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  pgadmin_data:
  redis_data: